name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block committed API keys
        run: |
          # Fails if the changes since the default branch add anything shaped like a Google API key.
          base="$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)"
          if git diff "$base"...HEAD --unified=0 | grep -E '^\+' | grep -Eq 'AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{40,}'; then
            echo "::error::A string that looks like an API key was added. Remove it and use a secret instead."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build   # syncs public assets, type-checks content schemas, builds the site
